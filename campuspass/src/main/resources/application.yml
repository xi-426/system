spring:
  application:
    name: campuspass
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/campuspass?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:campuspass}
    password: ${DB_PASSWORD:campuspass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:campuspass}
    password: ${RABBITMQ_PASSWORD:campuspass}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:campuspass-development-secret-key-change-me-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
